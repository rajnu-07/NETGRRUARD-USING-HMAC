<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDS Performance Comparison</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f8f9fa;
            margin: 0;
        }
        .chart-container {
            width: 80%;
            max-width: 900px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="chart-container">
    <h2>Efficiency Comparison: Literature Survey vs. NetGuard</h2>
    <canvas id="comparisonChart"></canvas>
</div>

<script>
    const ctx = document.getElementById('comparisonChart').getContext('2d');

    const data = {
        labels: [
            ['Rathee et al.', '(Blockchain)'], 
            ['Song et al.', '(Block+ML)'], 
            ['Kumar et al.', '(Block+IDS)'], 
            ['Hussain et al.', '(Quantum)'], 
            ['NetGuard', '(Your System)']
        ],
        datasets: [
            {
                label: 'Accuracy (%)',
                data: [88.5, 93.2, 91.0, 94.5, 98.2],
                backgroundColor: 'rgba(54, 162, 235, 0.8)',
                borderColor: 'rgba(54, 162, 235, 1)',
                borderWidth: 1,
                borderRadius: 4
            },
            {
                label: 'Precision (%)',
                data: [85.0, 91.8, 89.5, 92.0, 97.5],
                backgroundColor: 'rgba(75, 192, 192, 0.8)',
                borderColor: 'rgba(75, 192, 192, 1)',
                borderWidth: 1,
                borderRadius: 4
            }
        ]
    };

    const config = {
        type: 'bar',
        data: data,
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'top',
                    labels: {
                        font: { size: 14 }
                    }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return context.dataset.label + ': ' + context.parsed.y + '%';
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: false,
                    min: 80,
                    max: 100,
                    title: {
                        display: true,
                        text: 'Percentage (%)',
                        font: { size: 14, weight: 'bold' }
                    }
                },
                x: {
                    ticks: {
                        font: { size: 12 }
                    }
                }
            },
            animation: {
                duration: 1500,
                easing: 'easeOutQuart'
            }
        }
    };

    new Chart(ctx, config);
</script>

</body>
</html>
